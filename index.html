<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2026 - Milho Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Simulador de Cultivo de Milho 🌽</h1>
        <p class="subtitle">Selecione o método de manejo clicando em uma das imagens abaixo:</p>
        
        <div class="cards-container">
            <div class="card" id="card-convencional" onclick="selecionarManejo('convencional')">
                <img src="https://images.unsplash.com/photo-1589923188900-85dae523342b?auto=format&fit=crop&w=400&q=80" alt="Trator aplicando agrotóxico">
                <h3>Manejo Convencional</h3>
                <p>Aração do solo e uso exclusivo de defensivos químicos.</p>
            </div>

            <div class="card" id="card-sustentavel" onclick="selecionarManejo('sustentavel')">
                <img src="https://images.unsplash.com/photo-1601614392652-32a7620023ee?auto=format&fit=crop&w=400&q=80" alt="Milho saudável com plantio direto">
                <h3>Manejo Sustentável</h3>
                <p>Plantio Direto na palha e Controle Biológico de pragas.</p>
            </div>
        </div>

        <div id="resultado" class="resultado-box hidden">
            <h3>📊 Diagnóstico da Lavoura:</h3>
            <ul class="lista-metricas">
                <li id="metrica-solo"></li>
                <li id="metrica-biodiversidade"></li>
            </ul>
            <hr>
            <p id="veredito"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
