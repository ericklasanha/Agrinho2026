<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2026 - Rizicultura Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Arroz Tech Sustentável 🌾</h1>
        <p class="subtitle">Simulador de Emissões e Consumo na Produção de Arroz</p>
        
        <div class="form-group">
            <label for="hectares">Área de Plantio (em hectares):</label>
            <input type="number" id="hectares" placeholder="Ex: 10" min="1">
        </div>

        <div class="form-group">
            <label for="manejo">Sistema de Manejo da Água:</label>
            <select id="manejo">
                <option value="inundacao">Inundação Contínua (Tradicional)</option>
                <option value="intermitente">Irrigação Intermitente (Sustentável)</option>
            </select>
        </div>

        <button onclick="calcularProducao()">Analisar Sustentabilidade</button>

        <div id="resultado" class="resultado-box hidden">
            <h3>Relatório de Impacto:</h3>
            <p id="infoAgua"></p>
            <p id="infoGases"></p>
            <hr>
            <p id="veredito"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
